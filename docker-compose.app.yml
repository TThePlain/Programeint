# Stack completa local/staging (não é cloud TLS).
# Uso: docker compose -f docker-compose.yml -f docker-compose.app.yml up --build
services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/programeint
      REDIS_URL: redis://redis:6379
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      API_URL: http://api:4000
      APP_URL: http://localhost:3000
      API_PORT: "4000"
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailpit:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        API_URL: http://api:4000
    environment:
      API_URL: http://api:4000
      APP_URL: http://localhost:3000
    ports:
      - "3000:3000"
    depends_on:
      - api
